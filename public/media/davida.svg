<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0a0a0a; }
      .grid-line { stroke: rgba(255,255,255,0.06); stroke-width: 1; }
      .panel { fill: #111827; stroke: #e60026; stroke-width: 2; rx: 12px; }
      .panel-sub { fill: #161f33; stroke: rgba(255,255,255,0.18); stroke-width: 1.5; rx: 8px; }
      .red-box { fill: #e60026; rx: 8px; }
      .title-text { font-family: 'Outfit', -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; letter-spacing: -0.02em; }
      .mono-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .muted-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; fill: #9ca3af; }
      .flow-arrow { stroke: #e60026; stroke-width: 3; stroke-dasharray: 6 4; fill: none; }
      .badge-green { fill: #10b981; }
      .badge-pill { rx: 9999px; fill: rgba(255,255,255,0.1); stroke: rgba(255,255,255,0.25); stroke-width: 1; }
    </style>
    <filter id="shadow-davida" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#e60026" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="620" class="bg" rx="16" />
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="80" x2="1000" y2="80" class="grid-line" />
  <line x1="0" y1="540" x2="1000" y2="540" class="grid-line" />
  <line x1="320" y1="80" x2="320" y2="540" class="grid-line" />
  <line x1="680" y1="80" x2="680" y2="540" class="grid-line" />

  <!-- Top Header Bar -->
  <rect x="24" y="24" width="952" height="46" rx="8" fill="#141923" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <circle cx="50" cy="47" r="6" fill="#e60026" />
  <circle cx="70" cy="47" r="6" fill="#f59e0b" />
  <circle cx="90" cy="47" r="6" fill="#10b981" />
  <text x="120" y="52" class="mono-text" fill="#ffffff">DAVIDA RETAIL // E-COMMERCE CORE &amp; SEO TELEMETRY</text>
  <rect x="780" y="34" width="180" height="26" class="badge-pill" />
  <circle cx="796" cy="47" r="4" class="badge-green" />
  <text x="808" y="51" class="muted-mono" fill="#10b981">PERFORMANCE: 98/100</text>

  <!-- Column 1: Core Web Vitals & Speed Overhaul -->
  <rect x="40" y="110" width="240" height="400" class="panel-sub" />
  <rect x="56" y="126" width="208" height="32" class="red-box" />
  <text x="70" y="147" class="mono-text">01 // CORE WEB VITALS</text>
  
  <rect x="56" y="176" width="208" height="90" rx="6" fill="#0d1320" stroke="rgba(255,255,255,0.1)" />
  <text x="70" y="202" class="title-text" font-size="16px">LCP: 0.8s (Passed)</text>
  <text x="70" y="224" class="muted-mono">Largest Contentful Paint</text>
  <text x="70" y="244" class="muted-mono" fill="#10b981">99th percentile: sub-1s</text>

  <rect x="56" y="280" width="208" height="90" rx="6" fill="#0d1320" stroke="rgba(255,255,255,0.1)" />
  <text x="70" y="306" class="title-text" font-size="16px">INP: 32ms &amp; CLS: 0</text>
  <text x="70" y="328" class="muted-mono">Zero Cumulative Shift</text>
  <text x="70" y="348" class="muted-mono">CSS Critical Path Inlined</text>

  <rect x="56" y="384" width="208" height="106" rx="6" fill="#0d1320" stroke="rgba(255,255,255,0.1)" />
  <text x="70" y="410" class="mono-text" fill="#e60026">Asset Pipeline</text>
  <text x="70" y="432" class="muted-mono">• WebP/AVIF Auto-Convert</text>
  <text x="70" y="450" class="muted-mono">• Redis Object Cache Engine</text>
  <text x="70" y="468" class="muted-mono">• Brotli HTTP/3 Edge Cache</text>

  <!-- Flow Connector 1 to 2 -->
  <path d="M 280 310 L 360 310" class="flow-arrow" />
  <polygon points="360,310 350,305 350,315" fill="#e60026" />

  <!-- Column 2: Organic Search Architecture (Centerpiece) -->
  <rect x="360" y="100" width="280" height="420" class="panel" filter="url(#shadow-davida)" />
  <rect x="380" y="120" width="240" height="38" class="red-box" />
  <text x="398" y="144" class="mono-text">02 // ORGANIC EXPANSION</text>
  
  <g transform="translate(380, 176)">
    <rect width="240" height="74" rx="6" fill="#0d1320" stroke="rgba(255,255,255,0.12)" />
    <text x="16" y="28" class="title-text" font-size="15px" fill="#ffffff">Search Impressions</text>
    <text x="16" y="50" class="muted-mono" fill="#10b981">+340% Growth in 90 Days</text>
    <text x="16" y="64" class="muted-mono">42 First-Page Rankings</text>
  </g>

  <g transform="translate(380, 264)">
    <rect width="240" height="74" rx="6" fill="#0d1320" stroke="rgba(255,255,255,0.12)" />
    <text x="16" y="28" class="title-text" font-size="15px" fill="#ffffff">Automated JSON-LD</text>
    <text x="16" y="50" class="muted-mono">Product, Offer, AggregateRating</text>
    <text x="16" y="64" class="muted-mono">Google Merchant Center Synced</text>
  </g>

  <g transform="translate(380, 352)">
    <rect width="240" height="74" rx="6" fill="#0d1320" stroke="rgba(255,255,255,0.12)" />
    <text x="16" y="28" class="title-text" font-size="15px" fill="#ffffff">Conversion Funnel</text>
    <text x="16" y="50" class="muted-mono">Frictionless 1-Step Checkout</text>
    <text x="16" y="64" class="muted-mono">Cart Abandonment Reduced 41%</text>
  </g>

  <g transform="translate(380, 440)">
    <rect width="240" height="58" rx="6" fill="#1b2438" stroke="#e60026" stroke-width="1.5" />
    <text x="16" y="24" class="mono-text" fill="#10b981">SPEED INDEX: 0.9s</text>
    <text x="16" y="44" class="muted-mono">Organic Revenue: 4.2x Scale</text>
  </g>

  <!-- Flow Connector 2 to 3 -->
  <path d="M 640 310 L 720 310" class="flow-arrow" />
  <polygon points="720,310 710,305 710,315" fill="#e60026" />

  <!-- Column 3: Telemetry & Technical Schema -->
  <rect x="720" y="110" width="240" height="400" class="panel-sub" />
  <rect x="736" y="126" width="208" height="32" class="red-box" />
  <text x="750" y="147" class="mono-text">03 // SCHEMA GRAPH</text>
  
  <rect x="736" y="176" width="208" height="90" rx="6" fill="#0d1320" stroke="rgba(255,255,255,0.1)" />
  <text x="750" y="202" class="title-text" font-size="16px">Rich Snippets</text>
  <text x="750" y="224" class="muted-mono">Breadcrumbs &amp; Sitelinks</text>
  <text x="750" y="244" class="muted-mono" fill="#10b981">100% Rich Result Coverage</text>

  <rect x="736" y="280" width="208" height="90" rx="6" fill="#0d1320" stroke="rgba(255,255,255,0.1)" />
  <text x="750" y="306" class="title-text" font-size="16px">CAPI Deduplication</text>
  <text x="750" y="328" class="muted-mono">ServerTrack Integration</text>
  <text x="750" y="348" class="muted-mono">Full ROAS Attribution</text>

  <rect x="736" y="384" width="208" height="106" rx="6" fill="#0d1320" stroke="rgba(255,255,255,0.1)" />
  <text x="750" y="410" class="mono-text" fill="#e60026">Security &amp; Uptime</text>
  <text x="750" y="432" class="muted-mono">• DDoS Shielding (Cloudflare)</text>
  <text x="750" y="450" class="muted-mono">• Automatic Database Purge</text>
  <text x="750" y="468" class="muted-mono">• 99.98% Monitored Uptime</text>

  <!-- Footer Baseline -->
  <text x="40" y="580" class="muted-mono">DAVIDA ARCHITECTURE OVERHAUL // ENGINEERED BY YASER AHMMED RATUL // 94+ MOBILE PAGESPEED</text>
  <rect x="830" y="562" width="130" height="26" class="badge-pill" />
  <text x="844" y="579" class="muted-mono" fill="#ffffff">SYSTEM 05 / 06</text>
</svg>
